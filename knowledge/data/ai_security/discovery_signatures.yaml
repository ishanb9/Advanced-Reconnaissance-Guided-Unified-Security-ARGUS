# Shadow-AI discovery signatures (DATA, not code).  Each entry fingerprints an
# exposed AI/LLM/agent surface by port, service banner, and/or HTTP marker.
# Matched by agents/ai_red_team/discovery.py during a normal network engagement.
# Adding a new AI surface = adding an entry here.
#
# MATCHING SEMANTICS: a signature FIRES if ANY of
#   (a port in `ports` is open) OR (a banner substring appears) OR (a marker substring appears).
# Ports listed here are AI-DEDICATED (a port match alone implies AI with very low FP rate).
# Shared ports (80, 443, 8000, 8080, 3000, 5000, 8888, etc.) are NEVER listed in `ports` —
# detection on those relies solely on banners and markers.

# ─────────────────────────────────────────────────────────────────────────────
# LOCAL / SELF-HOSTED INFERENCE
# ─────────────────────────────────────────────────────────────────────────────

- id: ollama
  technology: "Ollama LLM server"
  category: shadow-ai
  ports: [11434]
  banners: ["ollama"]
  markers: ["/api/tags", "/api/chat", "/api/generate", "/api/show", "/api/pull"]
  owasp_llm: "LLM06 (Excessive Agency) — unauthenticated inference and model management"
  atlas: "AML.T0040"
  severity: critical
  governance: "Ollama is unauthenticated by default; any host that can reach port 11434 can run arbitrary prompts, enumerate loaded models, pull new models consuming host compute, and exfiltrate model weights. Shadow deployment with no inventory or egress control."
  remediation: "Add to AI asset inventory; bind Ollama to 127.0.0.1 or enforce network-level ACLs; require a reverse proxy with authentication before any internal exposure."

- id: llama_cpp_server
  technology: "llama.cpp HTTP inference server"
  category: shadow-ai
  ports: []
  banners: ["llama.cpp", "llama-server", "llama cpp"]
  markers: ["/completion", "/tokenize", "/detokenize", "/embedding", "/props", "llama.cpp"]
  owasp_llm: "LLM10 (Unbounded Consumption) — unauthenticated inference endpoint"
  atlas: "AML.T0040"
  severity: high
  governance: "A llama.cpp server exposes raw inference without authentication; callers can submit unbounded token generation requests exhausting host GPU/CPU, or extract model configuration details."
  remediation: "Inventory the host; disable external binding; place behind an authenticated reverse proxy with rate limiting."

- id: vllm
  technology: "vLLM inference server"
  category: shadow-ai
  ports: []
  banners: ["vllm"]
  markers: ["/v1/chat/completions", "x-vllm", "vllm-model", "vllm", "vllm_engine"]
  owasp_llm: "LLM10 (Unbounded Consumption) — high-throughput unauthenticated inference"
  atlas: "AML.T0040"
  severity: high
  governance: "vLLM exposes an OpenAI-compatible API for high-throughput inference; unauthenticated access enables prompt injection, denial-of-wallet attacks, and enumeration of served models."
  remediation: "Enable vLLM's API key authentication flag; place behind an authenticated gateway; restrict network exposure to authorized clients."

- id: lm_studio
  technology: "LM Studio local inference server"
  category: shadow-ai
  ports: [1234]
  banners: ["lm studio", "lmstudio"]
  markers: ["/lmstudio", "lm-studio", "x-lm-studio"]
  owasp_llm: "LLM01 (Prompt Injection) — developer tool exposed on network"
  atlas: "AML.T0040"
  severity: high
  governance: "LM Studio's local server is unauthenticated and intended for single-user developer use; network exposure turns a personal AI workbench into a promptable endpoint accessible to all LAN peers."
  remediation: "Restrict LM Studio to loopback; block port 1234 at VLAN/firewall boundary; add to shadow-AI inventory."

- id: localai
  technology: "LocalAI self-hosted inference server"
  category: shadow-ai
  # port 8080 removed — shared with web servers, proxies, dev tools; rely on banners/markers
  ports: []
  banners: ["localai", "local-ai"]
  markers: ["/localai", "x-localai", "localai_version", "/v1/models"]
  owasp_llm: "LLM02 (Sensitive Information Disclosure) — OpenAI-compatible unauthenticated API"
  atlas: "AML.T0040"
  severity: high
  governance: "LocalAI provides an unauthenticated OpenAI-compatible API fronting multiple local model backends; shadow exposure allows prompt injection and potential data exfiltration through the model."
  remediation: "Enable LocalAI's API key support; place behind an authenticated reverse proxy; limit network exposure."

- id: text_generation_webui
  technology: "Text-Generation-WebUI (oobabooga)"
  category: shadow-ai
  # ports 5000 (Flask default) and 5005 (generic) removed — shared with many dev servers; 7860 kept (Gradio-dedicated)
  ports: [7860]
  banners: ["text-generation-webui", "oobabooga", "oobaboogas"]
  markers: ["/api/v1/generate", "/api/v1/chat", "text_generation_webui", "/api/v1/model", "oobabooga"]
  owasp_llm: "LLM01 (Prompt Injection) — full model control panel exposed"
  atlas: "AML.T0040"
  severity: critical
  governance: "Text-Generation-WebUI exposes both a chat interface and an API with model loading/unloading controls; unauthenticated network access gives attackers full inference capability and the ability to load arbitrary models."
  remediation: "Enable '--api-key' and '--gradio-auth' flags; never expose publicly; restrict via VPN or host firewall."

- id: koboldcpp
  technology: "KoboldCpp inference server"
  category: shadow-ai
  ports: [5001]
  banners: ["koboldcpp", "kobold cpp", "koboldai"]
  markers: ["/api/v1/generate", "/api/extra/generate", "koboldcpp", "/api/v1/info/version", "KoboldAI"]
  owasp_llm: "LLM01 (Prompt Injection) — storytelling-tuned model accessible without auth"
  atlas: "AML.T0040"
  severity: high
  governance: "KoboldCpp is a popular local inference server (often running uncensored models) that is unauthenticated by default; network exposure enables prompt injection and access to potentially policy-violating model outputs."
  remediation: "Use '--host 127.0.0.1'; place behind an authenticated reverse proxy; add to asset inventory."

- id: triton_inference_server
  technology: "NVIDIA Triton Inference Server"
  category: shadow-ai
  # port 8000 removed — shared with many web services; 8001 (gRPC) and 8002 (metrics) kept as Triton-dedicated
  ports: [8001, 8002]
  banners: ["triton", "tritonserver", "nvidia triton"]
  markers: ["/v2/health/ready", "/v2/models", "/v2/repository", "tritonserver", "x-triton"]
  owasp_llm: "LLM10 (Unbounded Consumption) — production inference cluster surface"
  atlas: "AML.T0040"
  severity: high
  governance: "Triton Inference Server manages production ML model repositories; unauthenticated exposure (HTTP on 8000, gRPC on 8001, metrics on 8002) enables model enumeration, unbounded inference, and potential model extraction."
  remediation: "Enable Triton's authorization plugin; restrict HTTP/gRPC ports to internal service mesh; disable public metrics endpoint."

- id: torchserve
  technology: "TorchServe model serving"
  category: shadow-ai
  # port 8080 removed — shared with many web servers; 8081 (management) and 8082 (metrics) kept as TorchServe-dedicated
  ports: [8081, 8082]
  banners: ["torchserve", "torch serve", "pytorch serve"]
  markers: ["/predictions/", "torchserve", "/v2/models"]
  owasp_llm: "LLM10 (Unbounded Consumption) — model inference and management API exposed"
  atlas: "AML.T0040"
  severity: high
  governance: "TorchServe exposes both inference (8080) and management (8081) APIs; the management API allows registering, loading, and unloading arbitrary models — a severe risk if reachable without authentication."
  remediation: "Bind management API to loopback only; enforce network policy restricting inference API to authorized clients; require mTLS for service-to-service communication."

- id: ray_serve
  technology: "Ray Serve ML serving"
  category: shadow-ai
  # port 8000 removed — shared with many web services; 8265 (Ray dashboard) kept as Ray-dedicated
  ports: [8265]
  banners: ["ray serve", "ray dashboard", "rayserve"]
  markers: ["/api/serve/applications", "ray-serve", "x-ray-serve", "/serve/", "ray_cluster", "ray_dashboard"]
  owasp_llm: "LLM06 (Excessive Agency) — distributed ML cluster management"
  atlas: "AML.T0040"
  severity: high
  governance: "Ray Serve and its dashboard expose distributed ML cluster management; the dashboard (8265) can trigger arbitrary Python function execution across worker nodes — a severe privilege-escalation vector."
  remediation: "Restrict Ray dashboard and serve ports to admin VLAN; enable Ray's authentication token; never expose cluster ports to untrusted networks."

- id: kserve_seldon
  technology: "KServe / Seldon Core model server"
  category: shadow-ai
  ports: []
  banners: ["kserve", "seldon", "seldon-core", "inferenceservice"]
  # /v1/models and /v2/models alone are too generic; replaced with more specific markers
  markers: ["/v2/health/live", "/kserve", "inferenceservice", "seldon-deploy", "/v2/repository/models"]
  owasp_llm: "LLM10 (Unbounded Consumption) — Kubernetes-hosted inference exposed off-cluster"
  atlas: "AML.T0040"
  severity: high
  governance: "KServe/Seldon InferenceService endpoints exposed outside their Kubernetes namespace allow unauthenticated inference requests, model metadata leakage, and potential cluster pivot via Kubernetes API misconfigurations."
  remediation: "Enforce Istio/Knative mTLS; restrict external load balancer exposure; require OAuth2 token authentication on inference endpoints."

- id: bentoml
  technology: "BentoML serving API"
  category: shadow-ai
  # port 3000 removed — shared with Node.js/React dev servers; rely on banners/markers
  ports: []
  banners: ["bentoml", "bento ml", "bentoserver"]
  # /metrics and /healthz removed — generic Prometheus/k8s health endpoints on any service
  markers: ["bentoml", "bento_service", "X-BentoML", "/docs.json"]
  owasp_llm: "LLM02 (Sensitive Information Disclosure) — model metadata and inference exposed"
  atlas: "AML.T0040"
  severity: medium
  governance: "BentoML services expose an auto-generated OpenAPI docs endpoint that reveals model input/output schema and inference routes; unauthenticated access enables model fingerprinting and direct inference."
  remediation: "Deploy behind an authenticated API gateway; disable /docs.json in production; restrict network access to authorized service consumers."

- id: huggingface_tgi
  technology: "Hugging Face Text Generation Inference (TGI)"
  category: shadow-ai
  ports: []
  banners: ["text-generation-inference", "tgi", "huggingface tgi"]
  markers: ["/generate", "/generate_stream", "text-generation-inference", "/v1/chat/completions", "x-compute-type"]
  owasp_llm: "LLM10 (Unbounded Consumption) — streaming inference without rate limiting"
  atlas: "AML.T0040"
  severity: high
  governance: "Hugging Face TGI provides high-throughput streaming inference; unauthenticated exposure enables unbounded token generation draining GPU resources and allows adversarial prompt injection through the /generate endpoint."
  remediation: "Enable TGI's API token authentication; place behind a rate-limiting reverse proxy; restrict to authorized internal subnets."

- id: xinference
  technology: "Xinference (Xorbits Inference)"
  category: shadow-ai
  ports: [9997]
  banners: ["xinference", "xorbits inference"]
  # /v1/models alone is too generic; replaced with more specific markers
  markers: ["/v1/chat/completions", "xinference_version", "/v1/engines", "xinference"]
  owasp_llm: "LLM06 (Excessive Agency) — multi-modal model management API"
  atlas: "AML.T0040"
  severity: high
  governance: "Xinference exposes APIs for launching and managing multiple concurrent model instances (LLMs, embedding models, image models); unauthenticated access enables arbitrary model launches consuming cloud/on-prem GPU budget."
  remediation: "Enable Xinference's token-based auth; restrict port 9997 to ML engineer subnet; audit launched model instances against approved model inventory."

