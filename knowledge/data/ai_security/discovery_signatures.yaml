  governance: "An OpenRouter-style gateway aggregates multiple LLM provider credentials; unauthenticated or poorly secured access exposes upstream API keys and allows attackers to route arbitrary workloads through corporate-funded accounts."
  remediation: "Require authenticated access to the gateway; rotate upstream provider keys; monitor spend anomalies for billing abuse detection."

