  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/vendor/antd.reset.min.css"/>
  <link rel="stylesheet" href="/static/vendor/xterm.min.css"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <!-- Visual-skin stylesheet slot (apollo / tactical / bloomberg / glass / editorial / webgl).
       href is swapped at runtime by /static/js/components/SkinChooser.jsx based
       on the user's saved choice in localStorage argus.ui.skin.v1.  When the
       default "stellar" skin is active, this link has no href and main.css alone defines the look. -->
  <link id="argus-skin" rel="stylesheet" href=""/>

  <!-- ═══ AVATAR SYSTEM ═══════════════════════════════════════════════
       _base.css is ALWAYS loaded: extended tokens, utility/surface classes,
       density + motion profiles, texture overlays, no-data treatment and
       the accessibility layer (reduced-motion, contrast boost, focus rings).

       All six avatar sheets are loaded up-front (~43 KB total). Each is
       scoped to :root[data-avatar="ID"], so exactly one is ever active and
       switching is a single attribute change — instant, no network
       round-trip, and no flash of the wrong identity.
       /static/js/theme/avatars.js sets the attribute and persists it.
       ═════════════════════════════════════════════════════════════════ -->
  <link rel="stylesheet" href="/static/css/avatars/_base.css?v=2"/>
  <link rel="stylesheet" href="/static/css/avatars/blacksite.css?v=2"/>
  <link rel="stylesheet" href="/static/css/avatars/phosphor.css?v=2"/>
  <link rel="stylesheet" href="/static/css/avatars/redcell.css?v=2"/>
  <link rel="stylesheet" href="/static/css/avatars/ghostwire.css?v=2"/>
  <link rel="stylesheet" href="/static/css/avatars/dossier.css?v=2"/>
  <link rel="stylesheet" href="/static/css/avatars/warden.css?v=2"/>
  <!-- Layout archetypes MUST load after the avatar token sheets so their
       composition rules win. Contains no display:none — archetypes may
       reorder/resize/restack a panel, never hide one. -->
  <link rel="stylesheet" href="/static/css/avatars/_layouts.css?v=2"/>
  <!-- Overflow containment (unbounded lists scroll inside their panel instead
       of pushing/overlapping siblings) + the shared rich-dialog language. -->
  <link rel="stylesheet" href="/static/css/avatars/_components.css?v=3"/>
  <!-- Data-heavy panel containment. Uses the data-slot hooks to cap and
       internally scroll panels that render unbounded lists, so no panel can
       overlap a neighbour, starve a sibling, or break grid-row alignment.
       Loads last so its caps win; page roots and atoms are explicitly exempt. -->
  <link rel="stylesheet" href="/static/css/avatars/_containment.css?v=3"/>
</head>
